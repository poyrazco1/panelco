[window]
title = "CASE EIGHT: UNWRITTEN"
width = 1920
height = 1080
fullscreen = false
vsync = true
fov = 90.0

[player]
move_speed_walk = 2.6
move_speed_run = 5.2
move_speed_crouch = 1.3
capsule_radius = 0.35
capsule_height = 1.75
crouch_height = 1.0
step_height = 0.35
max_slope_deg = 45.0
jump_speed = 0.0        # jumping disabled by design (source doc 7.1: no jump needed for a horror investigation game)
fall_speed = 55.0
gravity = 9.81
mouse_sensitivity = 0.12

[physics]
gravity = -9.81
fixed_timestep = 0.016666666

[audio]
master_volume = 1.0
music_volume = 0.8
sfx_volume = 1.0
voice_volume = 1.0
driver = "null"          # no /dev/snd in this dev container; see reports/ENVIRONMENT_AUDIT.md

[network]
server_host = "127.0.0.1"
server_port = 8778
udp_game_port = 8779
reconnect_window_seconds = 300

[paths]
assets_dir = "assets"
data_dir = "data"
saves_dir = "saves"

[localization]
default_locale = "en"
supported_locales = ["en", "tr", "de", "fr", "es", "pt-BR", "it", "pl", "ru", "zh-Hans", "ja", "ko"]
fully_translated_locales = ["en", "tr"]
